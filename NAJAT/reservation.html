<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="reservation.css">
</head>
<body>
    <!-- Titre -->
    <h1>Créer mon événement</h1>

    <p>
        Remplissez ce formulaire pour organiser votre événement.
    </p>

    <!-- Formulaire -->
    <form>

        <label>Nom complet :</label><br>
        <input type="text" placeholder="Votre nom"><br><br>

        <label>Email :</label><br>
        <input type="email" placeholder="Votre email"><br><br>

        <label>Type d'événement :</label><br>

        <select>
            <option>Mariage</option>
            <option>Fiançailles</option>
            <option>bain</option>
            <option>hanna</option>
        </select>

        <br><br>

        <label>Date :</label><br>
        <input type="date"><br><br>

        <label>Message :</label><br>

        <textarea rows="5" cols="40"
        placeholder="Votre message">
        </textarea>

        <br><br>

        <input type="submit" value="Envoyer">

    </form>

    <br>

    <a href="galerie.html">
        Voir la galerie
    </a>

</body>
</html>
